name: phpstan

on:
  push:
    branches: [1.x]
    paths:
      - '**.php'
      - 'phpstan.neon'
      - '.github/workflows/phpstan.yml'
  pull_request:
    branches: [1.x]
    paths:
      - '**.php'
      - 'phpstan.neon'

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Authenticate Flux Pro registry
        env:
          FLUX_PRO_USERNAME: ${{ secrets.FLUX_PRO_USERNAME }}
          FLUX_PRO_PASSWORD: ${{ secrets.FLUX_PRO_PASSWORD }}
        run: |
          if [ -z "$FLUX_PRO_USERNAME" ] || [ -z "$FLUX_PRO_PASSWORD" ]; then
            echo "::error::FLUX_PRO_USERNAME and FLUX_PRO_PASSWORD secrets are required to install livewire/flux-pro."
            exit 1
          fi
          composer config --global --auth http-basic.composer.fluxui.dev "$FLUX_PRO_USERNAME" "$FLUX_PRO_PASSWORD"

      - name: Install composer dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github --no-progress --memory-limit=2G
