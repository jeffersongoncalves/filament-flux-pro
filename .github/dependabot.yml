# Standard Dependabot config (dependabot-std).
# Weekly, grouped, 7-day cooldown (time to catch a malicious release).
# One entry per ecosystem for every version branch; Dependabot reads this file from the default branch only.
# Framework majors are ignored so no branch ever gets a cross-major bump: 1.x = Filament 5.
# Explicit `versions` ranges, not `update-types`: without a composer.lock Dependabot skips update-types.

version: 2

registries:
  flux-pro:
    type: composer-repository
    url: https://composer.fluxui.dev
    username: ${{secrets.FLUX_PRO_USERNAME}}
    password: ${{secrets.FLUX_PRO_PASSWORD}}

updates:

  # ---------- 1.x ----------

  - package-ecosystem: github-actions
    directory: /
    target-branch: 1.x
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    target-branch: 1.x
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: filament/*
        versions:
          - '>=6.0'
      - dependency-name: jeffersongoncalves/filament-flux
        versions:
          - '>=2.0'
    registries:
      - flux-pro
    groups:
      composer-deps:
        patterns:
          - '*'
