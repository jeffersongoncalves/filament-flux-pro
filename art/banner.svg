<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#27272A" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="950" cy="310" rx="420" ry="290" fill="url(#amberGlow)"/>

  <!-- Top label -->
  <circle cx="80" cy="70" r="4" fill="#FBBF24"/>
  <text x="102" y="75" font-size="14" font-weight="500" letter-spacing="2" fill="#A1A1AA">FILAMENT PLUGIN</text>

  <!-- Title -->
  <text x="80" y="220" font-size="62" font-weight="800" letter-spacing="-2" fill="#FAFAFA">Filament Flux</text>
  <text x="80" y="288" font-size="62" font-weight="800" letter-spacing="-2" fill="url(#amber)">Pro</text>

  <!-- Tagline -->
  <text x="80" y="344" font-size="22" font-weight="600" fill="#FBBF24">Flux Pro components as Filament v5 natives</text>

  <!-- Description -->
  <text x="80" y="392" font-size="18" font-weight="400" fill="#A1A1AA">Date pickers, rich editor, charts, kanban and a global</text>
  <text x="80" y="416" font-size="18" font-weight="400" fill="#A1A1AA">command palette — wired into Forms, Widgets, Schemas and Pages.</text>

