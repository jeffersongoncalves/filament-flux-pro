    <rect x="180" y="545" width="118" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="239" y="565" text-anchor="middle" fill="#A1A1AA">Laravel 12 / 13</text>

    <rect x="306" y="545" width="100" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="356" y="565" text-anchor="middle" fill="#A1A1AA">Filament v5</text>

    <rect x="414" y="545" width="106" height="30" rx="15" fill="#18181B" stroke="#FBBF24"/>
    <text x="467" y="565" text-anchor="middle" fill="#FBBF24">Flux Pro 2.x</text>

    <rect x="528" y="545" width="58" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="557" y="565" text-anchor="middle" fill="#A1A1AA">MIT</text>
